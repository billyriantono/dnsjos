<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The panel serves both (brand file or neutral default); apple-touch-icon is added at runtime when the brand has one. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12254a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DnsJos</title>
    <script>
      // Apply the theme before first paint to avoid a light flash.
      (function () {
        var t = localStorage.getItem('dnsjos-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
