-- Bigger UDP socket buffers; must run before the listeners exist (kernel max raised in /etc/sysctl.d/90-dns.conf)
setUDPSocketBufferSizes(16777216, 16777216)

-- Import module and load the YAML config
dnsdistpath = "/etc/dnsdist/"
package.path = dnsdistpath .. package.path
dnsdist_ootb = require "dnsdist_ootb"
dnsdist_ootb.loadConfig{file=dnsdistpath .. "dnsdist.yml"}

-- infected / abusive customer handling
dofile(dnsdistpath .. "abuse.lua")

-- Cloudflare free-plan pools -> CGK aliases
dofile(dnsdistpath .. "cgk.lua")
